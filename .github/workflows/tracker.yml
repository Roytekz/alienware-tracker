name: Alienware Fast Pulse Tracker

on:
  schedule:
    # Runs a quick 5-second check every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Single Scan
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python main.py --single-run

      - name: Commit State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f alienware_state.json ]; then
            git add alienware_state.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "Update state [skip ci]" && git push)
          fi
